name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Clone sibling projects
        run: |
          cd ..
          git clone --depth 1 https://github.com/robcox2910/pebble-lang.git pebble-lang

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run ruff linter
        run: uv run ruff check .

      - name: Run ruff formatter check
        run: uv run ruff format --check .

      - name: Run pyright
        run: uv run pyright src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Clone sibling projects
        run: |
          cd ..
          git clone --depth 1 https://github.com/robcox2910/pebble-lang.git pebble-lang

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests with coverage
        run: uv run pytest --cov

  security:
    runs-on: ubuntu-latest
    # Advisory only: surfaces CVEs without blocking merges on upstream/transitive
    # vulnerabilities the project can't fix (e.g. a new CVE in pip or pytest).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Clone sibling projects
        run: |
          cd ..
          git clone --depth 1 https://github.com/robcox2910/pebble-lang.git pebble-lang

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run security checks (advisory)
        run: uv run pip-audit --skip-editable
